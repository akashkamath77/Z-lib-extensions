name: Termux OPDS checks

on:
  push:
    branches: [termux-opds-prototype]
    paths:
      - "termux-opds/**"
      - ".github/workflows/termux-opds-check.yml"
  pull_request:
    paths:
      - "termux-opds/**"
      - ".github/workflows/termux-opds-check.yml"

jobs:
  python-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: termux-opds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile server.py
      - run: python -m unittest discover -s tests -v
